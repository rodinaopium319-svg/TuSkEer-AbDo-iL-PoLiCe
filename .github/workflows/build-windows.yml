name: Build Windows x64 Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify .NET Version
        run: dotnet --info

      - name: Restore NuGet Dependencies
        run: dotnet restore TuSkEerAbDoILPoLiCe.sln

      - name: Build Release Configuration
        run: dotnet build TuSkEerAbDoILPoLiCe.sln -c Release --no-restore

      - name: Publish Self-Contained Windows x64
        run: >
          dotnet publish src-wpf/TuSkEer.AbDoILPoLiCe/TuSkEer.AbDoILPoLiCe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o dist/TuSkEer-AbDo-iL-PoLiCe-win-x64

      - name: Copy Documentation and Verify Output
        shell: pwsh
        run: |
          Copy-Item README.md dist/TuSkEer-AbDo-iL-PoLiCe-win-x64/README.md -ErrorAction SilentlyContinue
          Get-ChildItem dist/TuSkEer-AbDo-iL-PoLiCe-win-x64
          if (-not (Test-Path "dist/TuSkEer-AbDo-iL-PoLiCe-win-x64/TuSkEer.AbDoILPoLiCe.exe")) {
            throw "Expected executable TuSkEer.AbDoILPoLiCe.exe was not produced."
          }

      - name: Package Distributable ZIP Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "dist/TuSkEer-AbDo-iL-PoLiCe-win-x64/*" -DestinationPath "artifacts/TuSkEer-AbDo-iL-PoLiCe-win-x64.zip" -Force

      - name: Upload Windows x64 ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuSkEer-AbDo-iL-PoLiCe-win-x64
          path: artifacts/TuSkEer-AbDo-iL-PoLiCe-win-x64.zip
          retention-days: 30
